name: Release Assets

on:
  release:
    types: [ published ]

jobs:
  pack:
    name: Create and Upload Package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Extract version from tag
      id: version
      run: |
        VERSION="${{ github.ref_name }}"
        VERSION="${VERSION#v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore

    - name: Create package
      run: dotnet pack -c Release --output ./nupkg -p:Version=${{ steps.version.outputs.version }}

    - name: Calculate SHA256 checksum
      id: checksum
      run: |
        NUPKG_FILE="./nupkg/NuciLog.Core.${{ steps.version.outputs.version }}.nupkg"
        SHA256=$(sha256sum "$NUPKG_FILE" | awk '{print $1}')
        echo "sha256=$SHA256" >> $GITHUB_OUTPUT

    - name: Upload package to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./nupkg/NuciLog.Core.${{ steps.version.outputs.version }}.nupkg
        asset_name: NuciLog.Core.${{ steps.version.outputs.version }}.nupkg
        asset_content_type: application/zip

    - name: Update release notes with checksum
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const releaseId = context.payload.release.id;
          const currentBody = context.payload.release.body;
          const newChecksum = "${{ steps.checksum.outputs.sha256 }}";
          const checksumLine = `\n\n**SHA256 Checksum:** ${newChecksum}`;
          const updatedBody = currentBody + checksumLine;

          await github.rest.repos.updateRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: releaseId,
            body: updatedBody
          });
